[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
paper-core = { path = "crates/paper-core" }
paper-compile = { path = "crates/paper-compile" }
paper-mcp = { path = "crates/paper-mcp" }
paper-sync = { path = "crates/paper-sync" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
yrs = "0.28"
rusqlite = { version = "0.41", features = ["bundled"] }
similar = "2"
notify = "8"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
base64 = "0.22"
dunce = "1"
